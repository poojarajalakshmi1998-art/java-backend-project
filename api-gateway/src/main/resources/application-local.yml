spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: auth-service
              uri: http://localhost:8084
              predicates:
                - Path=/auth/**

            - id: order-service
              uri: http://localhost:8081
              predicates:
                - Path=/order/**

            - id: payment-service
              uri: http://localhost:8082
              predicates:
                - Path=/payments/**,/webhooks/**

server:
  port: 8085
jwt:
  secret: ${JWT_SECRET}



